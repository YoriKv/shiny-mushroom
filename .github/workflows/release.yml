name: Release

# Push a version tag (e.g. `v0.1.0`) to build Shiny Mushroom for Windows, Linux
# and macOS with PyInstaller and publish a GitHub Release with the artifacts:
#   - shiny-mushroom-<version>-win.zip   (portable Windows app folder, zipped)
#   - shiny-mushroom-<version>-linux.tar.gz   (portable Linux app folder, tarred)
#   - shiny-mushroom-<version>-mac-arm64.zip  (macOS .app bundle, Apple Silicon)
#   - shiny-mushroom-<version>-mac-intel.zip  (macOS .app bundle, Intel)
# The release body is the matching `## v<version>` section of CHANGELOG.md
# (auto-generated commit notes are appended; if the section is missing, the
# release falls back to the auto notes alone).
#
# Only the editor is published. The disassembly is source and stays source: it
# is built from the ROM the person running it already owns, and nothing here
# packages game data.
#
# This workflow runs in the mirror repository, which `mirror.py` publishes to
# from the development repository one commit per release, tag included. Both
# repositories hold this file; the `if:` guards on each job below are what keep
# the development one from building and publishing a second copy.
#
# Structure mirrors the CI workflow: a per-OS `build` matrix always uploads its
# artifact to the run; a single `release` job (tag push only) downloads them all
# and publishes ONE release, so the OS builds never race to create it. A manual
# run (workflow_dispatch) runs only the build matrix - handy for testing the
# build without publishing anything.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    # Only the mirror releases. This file is published verbatim into the mirror
    # repository by mirror.py, so both repositories carry it and both see the
    # release tag -- in the development repository that tag is a record of what
    # was published, not an instruction to publish it again. Without this guard
    # a release would be built four times over and published twice, once into a
    # repository nobody downloads from. A manual run is always allowed, so the
    # build can still be exercised from either side.
    if: github.repository == 'YoriKv/shiny-mushroom' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: shiny-mushroom-win
            # PowerShell: zip the onedir output folder.
            package: Compress-Archive -Path dist/shiny-mushroom/* -DestinationPath dist/shiny-mushroom-win.zip
            artifact: dist/shiny-mushroom-win.zip
            # Embedded into the .exe and shown in Explorer/taskbar.
            icon: --icon packaging/shiny-mushroom.ico
            core: windows-x64
            lib: MesenCore.dll
            sep: ';'
          - os: ubuntu-latest
            asset: shiny-mushroom-linux
            package: tar -czf dist/shiny-mushroom-linux.tar.gz -C dist shiny-mushroom
            artifact: dist/shiny-mushroom-linux.tar.gz
            # Linux has no build-time icon; the app sets its window icon at runtime.
            icon: ""
            core: linux-x64
            lib: MesenCore.so
            sep: ':'
          # Two native macOS builds. uv's Python is single-arch, so PyInstaller
          # cannot emit a universal2 app - instead each architecture builds on
          # its own runner. macos-latest is Apple Silicon; macos-15-intel is
          # GitHub's last x86_64 image.
          - os: macos-latest
            asset: shiny-mushroom-mac-arm64
            # --windowed produces shiny_mushroom.app; ditto preserves the bundle bits.
            package: ditto -c -k --keepParent dist/shiny-mushroom.app dist/shiny-mushroom-mac-arm64.zip
            artifact: dist/shiny-mushroom-mac-arm64.zip
            # Baked into the app's Info.plist and shown in the Dock/Finder.
            icon: --icon packaging/shiny-mushroom.icns
            core: macos-arm64
            lib: MesenCore.dylib
            sep: ':'
          - os: macos-15-intel
            asset: shiny-mushroom-mac-intel
            package: ditto -c -k --keepParent dist/shiny-mushroom.app dist/shiny-mushroom-mac-intel.zip
            artifact: dist/shiny-mushroom-mac-intel.zip
            icon: --icon packaging/shiny-mushroom.icns
            core: macos-x64
            lib: MesenCore.dylib
            sep: ':'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # PySide6 links a handful of system libraries the Linux runner does not
      # ship by default; PyInstaller must find them at build time to bundle them.
      - name: Install Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Sync dependencies
        run: uv sync --frozen

      # The emulator core is moved out of the package before PyInstaller runs,
      # for two reasons.
      #
      # It must be added with --add-binary, not collected as data. --collect-data
      # silently drops it on Linux (`.so` is a Python extension suffix, so
      # collect_data_files excludes `**/*.so` and no flag overrides that), and
      # even where it is collected, data files get no dependency analysis. The
      # core links SDL2, X11, ALSA, PulseAudio and libsamplerate at load time --
      # never called, since the editor initialises it with NULL window handles,
      # but the dynamic loader resolves them anyway. --add-binary pulls that
      # chain into the bundle; --add-data would ship a library that cannot load
      # on a machine without them.
      #
      # And moving it means only this platform's core ships. Left in place,
      # --collect-data would sweep all four in and put ~30 MB of other people's
      # architectures in every download.
      - name: Stage the emulator core
        shell: bash
        run: |
          source_dir="editor/shiny_mushroom/resources/mesen/${{ matrix.core }}"
          if [ ! -f "$source_dir/${{ matrix.lib }}" ]; then
            echo "::error::no vendored core at $source_dir/${{ matrix.lib }}. Run the"\
                 "'Mesen core' workflow, download mesen-cores-all and commit it."
            exit 1
          fi
          mkdir -p corestage
          cp "$source_dir"/* corestage/
          rm -rf editor/shiny_mushroom/resources/mesen
          ls -la corestage

      # --windowed: no console window on Win/macOS (a no-op on Linux). PySide6's
      # bundled PyInstaller hooks pull in the Qt plugins automatically.
      # --collect-data: PyInstaller only follows imports, so the package's data
      # files (shiny_mushroom/resources) must be collected explicitly or the frozen
      # app starts without its icon. The core is added separately above.
      # pyinstaller is pulled in ephemerally with --with so it need not live in
      # the dev dependency group / uv.lock.
      - name: Build app
        run: >
          uv run --with pyinstaller pyinstaller
          --name shiny-mushroom --windowed --noconfirm
          --add-binary "corestage/${{ matrix.lib }}${{ matrix.sep }}shiny_mushroom/resources/mesen/${{ matrix.core }}"
          --add-data "corestage/provenance.json${{ matrix.sep }}shiny_mushroom/resources/mesen/${{ matrix.core }}"
          --collect-data shiny_mushroom
          ${{ matrix.icon }}
          editor/shiny_mushroom/__main__.py

      # The GPL requires every binary we hand out to carry a copy of the licence,
      # so drop LICENSE into the build before it is packaged: alongside the
      # executable for the onedir builds, in Resources/ for the macOS bundle.
      # Must run before the macOS re-sign below - adding a file to a signed
      # bundle invalidates its signature.
      - name: Bundle the licence
        shell: bash
        run: |
          # THIRD-PARTY.md travels with LICENSE because it is doing a different
          # job: LICENSE is the terms, THIRD-PARTY.md is the "clear directions
          # next to the object code" that GPLv3 section 6d asks for when the
          # corresponding source for a bundled component - the Mesen core -
          # lives in someone else's repository. Shipping the terms without the
          # directions would leave a release that bundles a core incomplete.
          if [ -d dist/shiny-mushroom.app ]; then
            target=dist/shiny-mushroom.app/Contents/Resources
          else
            target=dist/shiny-mushroom
          fi
          cp LICENSE THIRD-PARTY.md "$target/"

          # Stamp where this build came from. The checkout has no fixed remote,
          # so the URL cannot be written into the file by hand without guessing
          # it -- and a wrong source URL in a licence notice is worse than none.
          # Appending is portable across all three runners; sed -i is not.
          {
            echo
            echo "## This release"
            echo
            echo "- Source: ${{ github.server_url }}/${{ github.repository }}"
            echo "- Revision: \`${{ github.sha }}\`"
            echo "- Built: ${{ github.ref_name }}"
          } >> "$target/THIRD-PARTY.md"

      # PyInstaller stamps LSMinimumSystemVersion from the build Python's own
      # deployment target (e.g. 11.0 on arm64), but the app's real floor is Qt's:
      # PySide6 6.10+ wheels are macosx_13_0. Stamp the honest minimum so older
      # systems get a clear "requires macOS 13" dialog instead of a launch crash,
      # then re-sign - editing Info.plist invalidates the ad-hoc signature
      # PyInstaller applied, and arm64 refuses unsigned binaries.
      - name: Stamp minimum macOS version
        if: runner.os == 'macOS'
        run: |
          PLIST=dist/shiny-mushroom.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion 13.0" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 13.0" "$PLIST"
          codesign --force --deep --sign - dist/shiny-mushroom.app

      # Split by OS: the `shell` key takes no expressions, so it cannot be picked
      # with ${{ runner.os … }}. `if:` does allow the runner context, and only the
      # matching step runs. Windows packages with PowerShell, the rest with bash.
      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ matrix.package }}

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ${{ matrix.package }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.artifact }}

  release:
    # Tag push on the mirror only: gather all OS builds and publish a single
    # release. See the build job above for why the repository is checked.
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'YoriKv/shiny-mushroom'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # GPLv3 section 6d lets the corresponding source for a bundled component
      # sit on a third-party server, but upstream can delete a tag or force-push
      # and then our directions point at nothing. Attaching the source to the
      # same release as the binary makes the obligation self-contained and
      # immune to that.
      #
      # Only when a core is actually bundled: shipping 25 MB of emulator source
      # beside a release that contains no emulator would be misleading, and the
      # check means nobody has to remember to turn this on when the first core
      # is vendored.
      - name: Attach the Mesen core source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cores=(editor/shiny_mushroom/resources/mesen/*/MesenCore.*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "No vendored core in this release; skipping the source archive."
            exit 0
          fi
          echo "Bundled cores: ${cores[*]}"

          repo=$(python3 -c "import json;print(json.load(open('packaging/mesen-pin.json'))['repository'])")
          ref=$(python3 -c "import json;print(json.load(open('packaging/mesen-pin.json'))['ref'])")
          commit=$(python3 -c "import json;print(json.load(open('packaging/mesen-pin.json'))['commit'])")

          # Fetch the pinned commit itself rather than a branch or tag: a tag can
          # be moved, a commit cannot, and this archive has to be exactly the
          # source those libraries were built from.
          mkdir -p mesen-src && cd mesen-src
          git init -q .
          git remote add origin "$repo"
          git fetch -q --depth 1 origin "$commit"
          git checkout -q FETCH_HEAD

          # The libraries are built from the pin *plus* the patches in
          # packaging/mesen-patches/, so the pinned commit on its own is not the
          # corresponding source of what we ship. Apply them, keep them in the
          # tree so the modification is visible as a diff as well as applied,
          # and archive the result -- GPL-3.0 section 5(a) wants the change
          # marked, and section 6 wants the source to be the source.
          #
          # --ignore-whitespace: the patches are stored LF and Mesen checks out
          # CRLF. Same reason build_mesen_core.py passes it.
          mkdir -p packaging
          cp -r ../packaging/mesen-patches packaging/mesen-patches
          for patch in packaging/mesen-patches/*.patch; do
            echo "Applying $(basename "$patch")"
            git apply -p1 --ignore-whitespace "$patch"
          done
          git add -A
          git -c user.name=release -c user.email=release@invalid \
            commit -q -m "Applied packaging/mesen-patches on top of ${commit}"

          out="../artifacts/mesen-source"
          mkdir -p "$out"
          name="mesen-core-source-${ref}-${commit:0:12}-patched.tar.gz"
          git archive --format=tar.gz --prefix="MesenCE-${ref}/" HEAD -o "$out/$name"
          cd ..
          echo "Wrote artifacts/mesen-source/$name ($(du -h "artifacts/mesen-source/$name" | cut -f1))"

      # Pull this version's section out of CHANGELOG.md for the release body.
      # Matches the heading's second field against the tag (`## v0.1.0 - …`), so
      # a trailing date or "unreleased" note is ignored. No matching section
      # means an empty file, and auto-generated notes only.
      - name: Extract changelog section
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            /^## / { on = ($2 == tag) ; next }
            on' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no \"## ${GITHUB_REF_NAME}\" section — release body will be auto-generated notes only."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: artifacts/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
